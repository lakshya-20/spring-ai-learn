receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Spring AI emits spring.ai.tool.call.; Langfuse prefers langfuse.observation. / gen_ai.tool.call.*
  transform/langfuse-tools:
    trace_statements:
      - context: span
        statements:
          - set(attributes["langfuse.observation.type"], "tool") where attributes["gen_ai.operation.name"] == "execute_tool"
          - set(attributes["langfuse.observation.input"], attributes["spring.ai.tool.call.arguments"]) where attributes["spring.ai.tool.call.arguments"] != nil
          - set(attributes["langfuse.observation.output"], attributes["spring.ai.tool.call.result"]) where attributes["spring.ai.tool.call.result"] != nil
          - set(attributes["gen_ai.tool.call.arguments"], attributes["spring.ai.tool.call.arguments"]) where attributes["spring.ai.tool.call.arguments"] != nil
          - set(attributes["gen_ai.tool.call.result"], attributes["spring.ai.tool.call.result"]) where attributes["spring.ai.tool.call.result"] != nil
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      # Base64 of "PUBLIC_KEY:SECRET_KEY" — set LANGFUSE_AUTH_HEADER in .env
      Authorization: "Basic ${env:LANGFUSE_AUTH_HEADER}"
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/langfuse-tools, batch]
      exporters: [debug, otlp_http/langfuse]