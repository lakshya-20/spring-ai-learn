spring.application.name=ollama
server.port=8081

#tells Spring container to not create ChatClient beans automatically
spring.ai.chat.client.enabled = false


# =====================================================
# Ollama
# =====================================================
spring.ai.ollama.base-url=http://localhost:11434
# Chat model
spring.ai.ollama.chat.options.model=llama3.2:latest
spring.ai.ollama.chat.options.temperature=0.7
# Embedding model
spring.ai.ollama.embedding.options.model=all-minilm


# =====================================================
# Gemini
# =====================================================
spring.ai.google.genai.api-key=AIzaSyBae881wGtQElanKi1xeggyvp25VjLJ8dU
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.max-output-tokens=2000


# =====================================================
# MySQL
# =====================================================
#spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai
#spring.datasource.username=root
#spring.datasource.password=root1234


# =====================================================
# MariaDB
# =====================================================
spring.datasource.url=jdbc:mariadb://localhost:3308/spring_ai
spring.datasource.username=root
spring.datasource.password=root1234


# =====================================================
# Spring AI
# =====================================================
spring.ai.chat.memory.repository.jdbc.initialize-schema=ALWAYS
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=384


# =====================================================
# MCP
# =====================================================
spring.ai.mcp.client.stdio.servers-configuration=classpath:servers.json


# =====================================================
# Observability (OpenTelemetry -> Collector -> Langfuse)
# =====================================================
# Sample 100% of traces (use a lower value in production)
management.tracing.sampling.probability=1.0

# Export traces to the local OpenTelemetry Collector (docker-compose)
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Allow longer attribute values so prompts/completions are not truncated
management.opentelemetry.tracing.limits.max-attribute-value-length=32768

# Include GenAI prompt/completion content in Spring AI observations
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
spring.ai.tools.observations.include-content=true